name: AutoOps 360 Daily Pipeline & Data Quality CI

on:
  schedule:
    # Runs daily at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pymysql

      - name: Execute Daily Pipeline Simulator
        run: |
          python src/run_daily_pipeline.py

      - name: Execute Automated Data Quality Assertion Suite
        run: |
          python src/data_quality_checks.py
