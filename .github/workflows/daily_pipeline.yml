name: AutoOps 360 Daily Pipeline & Data Quality CI

on:
  schedule:
    # Runs daily at 02:00 AM UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  run-pipeline-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pymysql

      - name: Execute Daily Pipeline Simulator
        run: |
          python src/run_daily_pipeline.py

      - name: Execute Automated Data Quality Assertion Suite (17 Positive Assertions)
        run: |
          python src/data_quality_checks.py

      - name: Execute Data Quality Anomaly Injection Suite (5 Negative Assertions)
        run: |
          python tests/test_data_quality_negative.py

      - name: Auto-Commit and Push Daily Data Updates
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marts/*.csv
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "Auto-update daily operational data marts [skip ci]"
            git push
          fi
